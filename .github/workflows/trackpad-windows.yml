name: Build Trackpad Installers

on:
  push:
    branches:
      - agent/trackpad-windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned NSIS installer
        run: npm exec -- tauri build --ci --bundles nsis --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS arm64 installer
    runs-on: macos-14
    env:
      CARGO_PROFILE_RELEASE_STRIP: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test pairing socket binding
        run: cargo test --manifest-path src-tauri/Cargo.toml pairing_socket_binds_to_advertised_ipv4_address --lib

      - name: Build unsigned DMG
        id: build_dmg
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            npm exec -- tauri build --ci --bundles dmg --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' && exit 0
            echo "DMG bundling attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Apply stable ad-hoc identity and package DMG
        if: always()
        run: |
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          ORIGINAL_DMG="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)"
          MOUNT_DIR="$RUNNER_TEMP/mykvm-original-dmg"
          APP_PATH="$RUNNER_TEMP/mykvm-stable.app"
          STAGE_DIR="$RUNNER_TEMP/mykvm-dmg"
          test -f "$ORIGINAL_DMG"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach "$ORIGINAL_DMG" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          SOURCE_APP="$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -print -quit)"
          test -d "$SOURCE_APP"
          ditto "$SOURCE_APP" "$APP_PATH"
          hdiutil detach "$MOUNT_DIR"
          codesign --force --deep --sign - \
            --requirements '=designated => identifier "com.xzhpl.mykvm"' \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR" "$DMG_DIR"
          ditto "$APP_PATH" "$STAGE_DIR/mykvm.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create \
            -volname "MyKVM 0.9.12 Trackpad" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "$DMG_DIR/MyKVM-0.9.12-macOS-arm64-trackpad.dmg"

      - name: Upload macOS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/mykvm.app.zip
          if-no-files-found: error
          retention-days: 7

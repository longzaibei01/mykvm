name: Build Trackpad Installers

on:
  push:
    branches:
      - agent/trackpad-windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned NSIS installer
        run: npm exec -- tauri build --ci --bundles nsis --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS arm64 installer
    runs-on: macos-14
    env:
      CARGO_PROFILE_RELEASE_STRIP: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test pairing socket binding
        run: cargo test --manifest-path src-tauri/Cargo.toml pairing_socket_binds_to_advertised_ipv4_address --lib

      - name: Build unsigned DMG
        id: build_dmg
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            npm exec -- tauri build --ci --bundles dmg --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' && exit 0
            echo "DMG bundling attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Package macOS app fallback
        if: steps.build_dmg.outcome == 'failure'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/mykvm.app src-tauri/target/release/bundle/macos/mykvm.app.zip

      - name: Upload macOS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/mykvm.app.zip
          if-no-files-found: error
          retention-days: 7

name: Build Trackpad Installers

on:
  push:
    branches:
      - agent/trackpad-windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned NSIS installer
        run: npm exec -- tauri build --ci --bundles nsis --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS arm64 installer
    runs-on: macos-14
    env:
      CARGO_PROFILE_RELEASE_STRIP: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned DMG
        run: npm exec -- tauri build --ci --bundles dmg --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: MyKVM-Trackpad-macOS-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
